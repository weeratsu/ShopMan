<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>ShopMan 🛒</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f3f4f6; --card: #fff; --ink: #1f2937; --muted: #9ca3af;
    --accent: #4f46e5; --done: #10b981; --danger: #ef4444; --line: #e5e7eb;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { width: 100%; max-width: 560px; min-height: 100vh; background: var(--card); display: flex; flex-direction: column; }
  header {
    background: var(--accent); color: #fff; padding: 18px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header .sub { font-size: 13px; opacity: .85; margin-top: 2px; }
  .inputbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); position: sticky; top: 71px; background: var(--card); z-index: 9; }
  .inputbar input {
    flex: 1; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; outline: none; background: #f9fafb;
  }
  .inputbar input:focus { border-color: var(--accent); background: #fff; }
  .inputbar button {
    font-size: 22px; width: 50px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 700;
  }
  .inputbar button:active { transform: scale(.95); }
  ul { list-style: none; flex: 1; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); animation: slide .18s ease;
  }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .chk {
    width: 26px; height: 26px; min-width: 26px; border: 2px solid var(--muted);
    border-radius: 50%; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 15px; color: #fff; transition: .15s;
  }
  li.done .chk { background: var(--done); border-color: var(--done); }
  .txt { flex: 1; font-size: 16px; word-break: break-word; cursor: pointer; }
  li.done .txt { text-decoration: line-through; color: var(--muted); }
  .del {
    background: none; border: none; font-size: 20px; color: var(--muted);
    cursor: pointer; padding: 4px 6px; border-radius: 8px;
  }
  .del:active { background: #fee2e2; color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 15px; line-height: 1.6; }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
    position: sticky; bottom: 0; background: var(--card);
  }
  footer button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  footer button:active { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 ShopMan</h1>
    <div class="sub">จดของที่หมด แล้วกดเช็คเมื่อซื้อแล้ว</div>
  </header>
  <div class="inputbar">
    <input id="inp" type="text" placeholder="เช่น นมสด, ไข่ไก่, น้ำยาล้างจาน..." autocomplete="off">
    <button id="add">+</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count">0 รายการ</span>
    <button id="clearDone">ลบที่ซื้อแล้ว</button>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var KEY = "shoppinglist.items.v1";
  var list = document.getElementById("list");
  var inp  = document.getElementById("inp");
  var items = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

  function render() {
    list.innerHTML = "";
    if (!items.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "ยังไม่มีรายการ<br>พิมพ์ของที่ต้องซื้อด้านบนแล้วกด +";
      list.appendChild(e);
    } else {
      // ยังไม่ซื้ออยู่บน, ซื้อแล้วไปล่าง
      var sorted = items.slice().sort(function (a, b) { return a.done - b.done; });
      sorted.forEach(function (it) {
        var li = document.createElement("li");
        if (it.done) li.className = "done";

        var chk = document.createElement("div");
        chk.className = "chk";
        chk.textContent = it.done ? "✓" : "";
        chk.onclick = function () { it.done = !it.done; save(); render(); };

        var txt = document.createElement("div");
        txt.className = "txt";
        txt.textContent = it.text;
        txt.onclick = function () { it.done = !it.done; save(); render(); };

        var del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.onclick = function () {
          items = items.filter(function (x) { return x.id !== it.id; });
          save(); render();
        };

        li.appendChild(chk); li.appendChild(txt); li.appendChild(del);
        list.appendChild(li);
      });
    }
    var left = items.filter(function (x) { return !x.done; }).length;
    document.getElementById("count").textContent = left + " รายการที่ต้องซื้อ";
  }

  function add() {
    var t = inp.value.trim();
    if (!t) return;
    items.push({ id: Date.now() + "" + Math.random().toString(36).slice(2, 6), text: t, done: false });
    inp.value = "";
    save(); render(); inp.focus();
  }

  document.getElementById("add").onclick = add;
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  document.getElementById("clearDone").onclick = function () {
    items = items.filter(function (x) { return !x.done; });
    save(); render();
  };

  render();
})();
</script>
</body>
</html>
