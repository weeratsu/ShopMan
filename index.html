<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/x-icon" href="images/shopman-favicon.ico?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="images/shopman-favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="images/shopman-icon-192.png?v=1">
<link rel="apple-touch-icon" href="images/shopman-apple-touch-icon.png?v=1">
<link rel="icon" type="image/svg+xml" href="images/shopman-icon.svg?v=1">
<title>ShopMan 🛒</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f3f4f6; --card: #fff; --ink: #1f2937; --muted: #9ca3af;
    --accent: #4f46e5; --done: #10b981; --danger: #ef4444; --line: #e5e7eb;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { width: 100%; max-width: 560px; min-height: 100vh; background: var(--card); display: flex; flex-direction: column; }
  header {
    background: var(--accent); color: #fff; padding: 18px 16px;
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .gear { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 18px; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; }
  .gear:active { transform: scale(.92); }
  .syncline { font-size: 11px; opacity: .8; margin-top: 4px; min-height: 14px; }
  .inputbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); position: sticky; top: 86px; background: var(--card); z-index: 9; }
  .inputbar input {
    flex: 1; font-size: 14px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; outline: none; background: #f9fafb;
  }
  .inputbar input:focus { border-color: var(--accent); background: #fff; }
  .inputbar button {
    font-size: 22px; width: 50px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 700;
  }
  .inputbar button:active { transform: scale(.95); }
  ul { list-style: none; flex: 1; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); animation: slide .18s ease;
    background: var(--card);
    transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .15s;
  }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  /* แถวต้นฉบับที่กำลังลาก = เอาออกจาก flow (height:0) แล้วใช้ transform ของแถวอื่นเปิด gap แทน */
  li.ghost-src {
    opacity: 0; transition: none; pointer-events: none;
  }
  /* ตัวโคลนที่ลอยตามนิ้ว */
  li.floating {
    position: fixed; left: 0; right: 0; z-index: 200; margin: 0;
    pointer-events: none; list-style: none;
    background: #fff; border: 1px solid var(--accent);
    border-radius: 12px; box-shadow: 0 12px 28px rgba(79,70,229,.28);
    transform: scale(1.03) rotate(-1deg); transition: none;
    max-width: 560px; margin-left: auto; margin-right: auto;
  }
  li.shift { transition: transform .18s cubic-bezier(.2,.8,.2,1); }
  .drag { cursor: grab; color: #cbd5e1; font-size: 18px; min-width: 20px; text-align: center; touch-action: none; user-select: none; align-self: center; }
  .drag:active { cursor: grabbing; }
  li.done .drag { color: #e5e7eb; }
  .chk {
    width: 26px; height: 26px; min-width: 26px; border: 2px solid var(--muted);
    border-radius: 50%; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 15px; color: #fff; transition: .15s; margin-top: 2px;
  }
  li.done .chk { background: var(--done); border-color: var(--done); }
  .body { flex: 1; min-width: 0; }
  .txt { font-size: 14px; word-break: break-word; cursor: pointer; }
  li.done .txt { text-decoration: line-through; color: var(--muted); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .meta .buy { color: var(--done); }
  .del {
    background: none; border: none; font-size: 20px; color: var(--muted);
    cursor: pointer; padding: 4px 6px; border-radius: 8px; align-self: flex-start;
  }
  .del:active { background: #fee2e2; color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; line-height: 1.6; }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
    position: sticky; bottom: 0; background: var(--card);
  }
  footer button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  footer button:active { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
  /* Tab bar (ลิสต์ / ร้านค้า) */
  .tabbar { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); position: sticky; top: 71px; background: var(--card); z-index: 9; }
  .tabbar button { flex: 1; padding: 10px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 10px; transition: .15s; }
  .tabbar button.active { color: #fff; background: var(--accent); }
  .tabbar button:not(.active):active { background: #eef2ff; }
  .page { display: none; flex-direction: column; flex: 1; }
  .page.active { display: flex; }
  /* Store filter chips (หน้าลิสต์) */
  .storefilter { display: flex; gap: 7px; padding: 11px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--card); scrollbar-width: none; }
  .storefilter::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-size: 12px; font-weight: 500; padding: 7px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); cursor: pointer; white-space: nowrap; transition: .15s; }
  .chip:active { transform: scale(.95); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(79,70,229,.25); }
  .meta .store-tag { color: var(--accent); font-weight: 600; }
  /* Store management page */
  .store-add { display: flex; gap: 8px; padding: 14px 12px; background: #fafbff; border-bottom: 1px solid var(--line); }
  .store-add input { flex: 1; font-size: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: #f9fafb; }
  .store-add input:focus { border-color: var(--accent); background: #fff; }
  .store-add button { font-size: 22px; width: 50px; border: none; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 700; }
  .store-add button:active { transform: scale(.95); }
  #storeList { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .store-li { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: .15s; }
  .store-li:active { transform: scale(.995); }
  .store-ic { width: 40px; height: 40px; min-width: 40px; border-radius: 11px; background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .store-li .name { flex: 1; font-size: 14px; font-weight: 600; }
  .store-li .cnt { font-size: 12px; font-weight: 500; color: var(--accent); background: #eef2ff; padding: 4px 11px; border-radius: 999px; }
  .store-li .del { background: none; border: none; font-size: 19px; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 9px; transition: .15s; }
  .store-li .del:active { background: #fee2e2; color: var(--danger); }
  .store-li .del:active { background: #fee2e2; color: var(--danger); }
  /* custom select (minimal, เข้าธีม) — ใช้ลูกศร ▾ เองผ่าน background svg */
  .item-store {
    font-size: 12px; color: var(--ink); margin-top: 5px; max-width: 180px;
    padding: 5px 28px 5px 10px; border: 1.5px solid var(--line); border-radius: 8px;
    background-color: #fff; cursor: pointer; touch-action: auto;
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='3' stroke-linecap='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 9px center; background-size: 12px;
    transition: .15s;
  }
  .item-store:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .item-store:hover { border-color: #c7cbd1; }
  /* Settings overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .overlay.open { display: flex; }
  .sheet { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; }
  .sheet h2 { font-size: 17px; margin-bottom: 4px; }
  .sheet p { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .sheet label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  .sheet input[type=text] { width: 100%; font-size: 14px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .sheet input[type=text]:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
  .btns { display: flex; gap: 8px; margin-top: 18px; }
  .btns button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btns .save { background: var(--accent); color: #fff; }
  .btns .cancel { background: #f3f4f6; color: var(--ink); }
  .btns .save:active, .btns .cancel:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🛒 ShopMan</h1>
      <div class="sub">จดของที่หมด แล้วกดเช็คเมื่อซื้อแล้ว</div>
      <div class="syncline" id="syncline"></div>
    </div>
    <button class="gear" id="gear" title="ตั้งค่า">⚙</button>
  </header>
  <div class="tabbar">
    <button id="tabList" class="active" data-page="list">🛒 ลิสต์</button>
    <button id="tabStore" data-page="store">🏪 ร้านค้า</button>
  </div>

  <!-- หน้า: ลิสต์ -->
  <div class="page active" id="page-list">
    <div class="inputbar">
      <input id="inp" type="text" placeholder="เช่น นมสด, ไข่ไก่, น้ำยาล้างจาน..." autocomplete="off">
      <button id="add">+</button>
    </div>
    <div class="storefilter" id="storefilter"></div>
    <ul id="list"></ul>
    <footer>
      <span id="count">0 รายการ</span>
      <button id="clearDone">ลบที่ซื้อแล้ว</button>
    </footer>
  </div>

  <!-- หน้า: ร้านค้า -->
  <div class="page" id="page-store">
    <div class="store-add">
      <input id="storeInp" type="text" placeholder="ชื่อร้าน เช่น Makro, Lotus, 7-11..." autocomplete="off">
      <button id="storeAdd">+</button>
    </div>
    <div id="storeList"></div>
    <div class="empty" id="storeHint" style="display:none;">ยังไม่มีร้าน<br>เพิ่มร้านด้านบน แล้ว map ของในหน้าลิสต์</div>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>⚙ ตั้งค่า Sync</h2>
    <p>วาง Web App URL จาก Google Apps Script (ลงท้าย /exec) เพื่อให้คอมและมือถือใช้ลิสต์เดียวกัน</p>
    <label>Google Apps Script Web App URL</label>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/XXX/exec" autocomplete="off">
    <div class="row">
      <input type="checkbox" id="pauseChk" style="width:18px;height:18px;">
      <label for="pauseChk" style="margin:0;font-weight:500;">หยุด sync ชั่วคราว (ใช้เฉพาะเครื่องนี้)</label>
    </div>
    <div class="btns">
      <button class="cancel" id="cfgCancel">ยกเลิก</button>
      <button class="save" id="cfgSave">บันทึก</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var KEY = "shoppinglist.items.v1";
  var CFG = "shoppinglist.cfg.v1";
  var STKEY = "shoppinglist.stores.v1";   // รายชื่อร้าน (array ของ string)
  var activeStore = "";                     // ร้านที่ filter อยู่ ("" = ทั้งหมด)
  var selectOpen = false;                   // dropdown เลือกร้านเปิดอยู่ไหม
  var renderDeferred = false;               // มี render ที่ถูกเลื่อนไว้ระหว่าง dropdown เปิด
  var lastSig = null;                       // signature ของสถานะที่ render ล่าสุด (กันจอกระพริบตอน sync)
  // guard กัน empty-overwrite:
  //  pulledOnce = ดึงจาก Sheet สำเร็จอย่างน้อย 1 ครั้งในรอบนี้แล้วหรือยัง
  //  hadLocal   = ตอนเปิดแอป มีข้อมูลจริงในเครื่องอยู่ก่อนไหม
  var pulledOnce = false;
  var list = document.getElementById("list");
  var inp  = document.getElementById("inp");
  var items = load();
  var cfg = loadCfg();
  var stores = loadStores();
  var hadLocal = items.filter(function (x) { return !x.deleted; }).length > 0;

  function loadStores() {
    try { return JSON.parse(localStorage.getItem(STKEY)) || []; }
    catch (e) { return []; }
  }
  function saveStores() { localStorage.setItem(STKEY, JSON.stringify(stores)); }

  // รวมรายชื่อร้านจาก server + เครื่อง (union, ไม่ซ้ำ)
  function mergeStores(serverStores) {
    var set = {}; var out = [];
    (serverStores || []).concat(stores).forEach(function (s) {
      if (isValidStore(s) && !set[s]) { set[s] = 1; out.push(s); }
    });
    return out;
  }

  // กรองชื่อร้านที่ใช้ได้ — ตัดค่าขยะ เช่น Date object ที่หลุดเข้ามา ("... GMT+...")
  function isValidStore(s) {
    if (!s || typeof s !== "string") return false;
    if (/GMT[+-]\d|Indochina Time|\d{4} \d\d:\d\d:\d\d/.test(s)) return false; // ดูเป็น Date
    return true;
  }

  // รายชื่อร้านทั้งหมด = union(stores ที่ตั้งไว้, ร้านที่ item ใช้จริง)
  // กันเคสเปิดอีกเครื่องแล้ว item มี store แต่ stores (localStorage แยกเครื่อง) ยังไม่มี → dropdown จะได้มี option
  function allStores() {
    var set = {}; var out = [];
    stores.forEach(function (s) { if (s && !set[s]) { set[s] = 1; out.push(s); } });
    items.forEach(function (x) {
      if (!x.deleted && x.store && !set[x.store]) { set[x.store] = 1; out.push(x.store); }
    });
    // เรียงตามตัวอักษร (รองรับไทย/อังกฤษ) → แท็บร้าน/dropdown/chip เรียงตรงกันหมด
    return out.sort(function (a, b) { return a.localeCompare(b, "th"); });
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function loadCfg() {
    try { return JSON.parse(localStorage.getItem(CFG)) || { url: "", pause: false }; }
    catch (e) { return { url: "", pause: false }; }
  }
  function saveCfg() { localStorage.setItem(CFG, JSON.stringify(cfg)); }

  function setSync(txt) { document.getElementById("syncline").textContent = txt || ""; }

  function fmt(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var dd = ("0" + d.getDate()).slice(-2);
    var mm = ("0" + (d.getMonth() + 1)).slice(-2);
    var yy = d.getFullYear();
    var hh = ("0" + d.getHours()).slice(-2);
    var mi = ("0" + d.getMinutes()).slice(-2);
    return dd + "/" + mm + "/" + yy + " " + hh + ":" + mi;
  }

  /* ---------- sync ---------- */
  function canSync() { return cfg.url && !cfg.pause; }

  // ยิง fetch แบบ retry กัน Apps Script cold-start (หลับอยู่ → ตื่นช้า/คืน HTML)
  function fetchJson(opts, tries, cb) {
    tries = tries || 0;
    var delays = [0, 2500, 6000]; // ครั้งแรกทันที, แล้ว 2.5s, 6s
    fetch(cfg.url, opts)
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var data;
        try { data = JSON.parse(txt); }
        catch (e) { data = null; } // ได้ HTML = ยังตื่นไม่สุด
        if (data && data.ok) { cb(null, data); return; }
        throw new Error("not-json");
      })
      .catch(function (err) {
        if (tries < delays.length - 1) {
          setSync("⏳ กำลังปลุก Google… (" + (tries + 2) + "/" + delays.length + ")");
          setTimeout(function () { fetchJson(opts, tries + 1, cb); }, delays[tries + 1]);
        } else {
          cb(err || new Error("fail"));
        }
      });
  }

  // มีข้อมูลจริงในเครื่องไหม (กันดันของว่างทับ Sheet)
  function hasRealData() {
    return items.filter(function (x) { return !x.deleted; }).length > 0;
  }

  // merge server + local แบบ last-write-wins ตาม updatedAt — เก็บ tombstone (deleted) ไว้ด้วย
  // ไม่ทิ้ง deleted: ต้องเก็บไว้ส่ง server จนกว่าจะยืนยัน ไม่งั้นลบแล้วเด้งกลับ
  function mergeFromServer(serverItems) {
    var byId = {};
    items.forEach(function (x) { byId[x.id] = x; });        // local ก่อน
    (serverItems || []).forEach(function (sv) {
      var lo = byId[sv.id];
      if (!lo) { byId[sv.id] = sv; return; }
      // ใครมี updatedAt ใหม่กว่า ชนะทั้ง record
      if ((sv.updatedAt || 0) > (lo.updatedAt || 0)) byId[sv.id] = sv;
      // updatedAt เท่ากัน: ถ้าฝั่งใดฝั่งหนึ่ง deleted ให้ deleted ชนะ (tombstone เหนียวแน่น)
      else if ((sv.updatedAt || 0) === (lo.updatedAt || 0) && sv.deleted) byId[sv.id] = sv;
    });
    return Object.keys(byId).map(function (k) { return byId[k]; });
  }

  // ===== sync engine: push ทีละครั้ง + dirty flag + debounce (กัน race) =====
  var syncing = false;      // กำลัง push อยู่ไหม (in-flight)
  var dirty = false;        // มีการเปลี่ยนแปลงค้างระหว่าง push
  var syncTimer = null;     // debounce timer

  // เรียกตัวนี้แทน push() ทุกครั้งที่มี mutation — รวม/หน่วง/กันซ้อนให้เอง
  function scheduleSync() {
    if (!canSync()) return;
    dirty = true;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncTimer = null; runSync(); }, 400);
  }

  function runSync() {
    if (!canSync()) return;
    if (syncing) { dirty = true; return; }   // มี push ค้าง → ค่อย push รอบเดียวหลังเสร็จ
    // GUARD empty-overwrite: เครื่องเปล่าเปิดครั้งแรก ต้อง pull ก่อน
    if (!pulledOnce && !hadLocal) { pull(); return; }
    syncing = true; dirty = false;
    setSync("⏳ กำลังซิงก์...");
    fetchJson({
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ items: items, stores: stores })
    }, 0, function (err, res) {
      syncing = false;
      if (!err && res && res.items) {
        pulledOnce = true;
        items = mergeFromServer(res.items);
        if (res.stores) stores = mergeStores(res.stores);
        normalizeOrder();
        save(); saveStores(); render();
        setSync("✓ ซิงก์ล่าสุด " + fmt(Date.now()));
      } else { setSync("⚠ ออฟไลน์ (บันทึกในเครื่องแล้ว)"); }
      if (dirty) runSync();   // มีการแก้ระหว่าง push → push ต่ออีกรอบเดียว
    });
  }

  function pull() {
    if (!canSync()) return;
    setSync("⏳ กำลังดึงข้อมูล...");
    fetchJson({ method: "GET" }, 0, function (err, res) {
      if (!err && res && res.items) {
        pulledOnce = true;
        items = mergeFromServer(res.items);
        if (res.stores) stores = mergeStores(res.stores);
        normalizeOrder();
        save(); saveStores(); render();
        setSync("✓ ซิงก์ล่าสุด " + fmt(Date.now()));
      } else { setSync("⚠ ออฟไลน์ (ใช้ข้อมูลในเครื่อง)"); }
    });
  }

  /* push() เดิมถูกแทนด้วย runSync()/scheduleSync() ด้านบน */

  /* ---------- render ---------- */
  // สร้าง signature ของสถานะที่มีผลต่อการแสดงผล — ถ้าไม่เปลี่ยน ไม่ต้อง re-render (กันจอกระพริบ)
  function sigOf() {
    var vis = items.filter(function (x) { return !x.deleted; })
      .map(function (x) { return x.id + ":" + (x.done ? 1 : 0) + ":" + (x.order || 0) + ":" + (x.store || "") + ":" + x.text + ":" + (x.doneAt || 0); });
    return activeStore + "|" + stores.join(",") + "|" + vis.sort().join("|");
  }

  function render(force) {
    // ถ้า dropdown เลือกร้านเปิดอยู่ อย่าเพิ่ง re-render (จะไปปิด dropdown) — เลื่อนไว้ทำหลัง blur
    if (selectOpen) { renderDeferred = true; return; }
    // กันจอกระพริบ: ถ้าไม่ได้บังคับ และสถานะไม่เปลี่ยนจากครั้งก่อน → ข้าม (ไม่ล้าง DOM)
    var sig = sigOf();
    if (!force && sig === lastSig) return;
    lastSig = sig;
    renderFilter();
    list.innerHTML = "";
    var visible = items.filter(function (x) {
      if (x.deleted) return false;
      if (activeStore === "__none__") { if (x.store) return false; }  // เฉพาะที่ไม่ระบุร้าน
      else if (activeStore && (x.store || "") !== activeStore) return false; // filter ตามร้าน
      return true;
    });
    if (!visible.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "ยังไม่มีรายการ<br>พิมพ์ของที่ต้องซื้อด้านบนแล้วกด +";
      list.appendChild(e);
    } else {
      // เรียง: ยังไม่ซื้อก่อน (ตาม order) → ซื้อแล้วไปล่าง (ตาม order)
      var sorted = visible.slice().sort(function (a, b) {
        if (a.done !== b.done) return a.done - b.done;
        return (a.order == null ? 0 : a.order) - (b.order == null ? 0 : b.order);
      });
      sorted.forEach(function (it) {
        var li = document.createElement("li");
        if (it.done) li.className = "done";
        li.setAttribute("data-id", it.id);

        var drag = document.createElement("div");
        drag.className = "drag";
        drag.textContent = "⠿";
        drag.setAttribute("data-handle", "1");

        var chk = document.createElement("div");
        chk.className = "chk";
        chk.textContent = it.done ? "✓" : "";
        chk.onclick = function () { toggle(it); };

        var body = document.createElement("div");
        body.className = "body";

        var txt = document.createElement("div");
        txt.className = "txt";
        txt.textContent = it.text;
        txt.onclick = function () { toggle(it); };

        var meta = document.createElement("div");
        meta.className = "meta";
        var mhtml = "➕ เพิ่ม: " + fmt(it.addedAt);
        if (it.store) mhtml += "  <span class='store-tag'>🏪 " + it.store + "</span>";
        if (it.done && it.doneAt) mhtml += "<br><span class='buy'>✓ ซื้อ: " + fmt(it.doneAt) + "</span>";
        meta.innerHTML = mhtml;

        // dropdown เลือกร้านของ item นี้
        var sel = document.createElement("select");
        sel.className = "item-store";
        var optNone = document.createElement("option");
        optNone.value = ""; optNone.textContent = "— ไม่ระบุร้าน —";
        sel.appendChild(optNone);
        allStores().forEach(function (s) {
          var o = document.createElement("option");
          o.value = s; o.textContent = s;
          if ((it.store || "") === s) o.selected = true;
          sel.appendChild(o);
        });
        sel.onchange = function () { setStore(it, sel.value); };
        // กัน pointerdown บน dropdown ไม่ให้ไป trigger drag / ปิด dropdown ตัวเอง
        sel.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        sel.addEventListener("click", function (e) { e.stopPropagation(); });
        // ระหว่าง dropdown เปิดอยู่ ห้าม render ทับ (กัน sync ย้อนกลับมาปิด dropdown)
        sel.addEventListener("focus", function () { selectOpen = true; });
        sel.addEventListener("blur", function () {
          selectOpen = false;
          // ไม่ต้อง render ที่นี่ — setStore อัปเดต in-place ให้แล้ว (กันจอกระพริบ)
          if (renderDeferred) { renderDeferred = false; render(); }
        });

        body.appendChild(txt); body.appendChild(meta); body.appendChild(sel);

        var del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.onclick = function () { removeItem(it); };

        li.appendChild(drag); li.appendChild(chk); li.appendChild(body); li.appendChild(del);
        list.appendChild(li);
      });
      attachDrag();
    }
    var left = items.filter(function (x) { return !x.deleted && !x.done; }).length;
    document.getElementById("count").textContent = left + " รายการที่ต้องซื้อ";
  }

  /* ---------- mutations (ดัน sync ทุกครั้ง) ---------- */
  function toggle(it) {
    it.done = !it.done;
    it.doneAt = it.done ? Date.now() : null;
    it.updatedAt = Date.now();
    save(); render(true); scheduleSync();
  }

  /* ---------- drag reorder (เมาส์ + นิ้ว) — ย้าย ghost placeholder ใน DOM ---------- */
  var dragId = null, floatEl = null, srcEl = null, grabDY = 0, lastClientY = 0, autoScrollRAF = null, dragH = 0;

  function attachDrag() {
    list.querySelectorAll("[data-handle]").forEach(function (h) {
      h.addEventListener("pointerdown", onDown);
    });
  }

  function liOf(node) {
    while (node && node.tagName !== "LI") node = node.parentNode;
    return node;
  }

  function onDown(e) {
    e.preventDefault();
    var li = liOf(e.target);
    if (!li) return;
    dragId = li.getAttribute("data-id");
    srcEl = li;
    lastClientY = e.clientY;

    var rect = li.getBoundingClientRect();
    grabDY = e.clientY - rect.top;
    dragH = rect.height;

    // ตัวโคลนลอยตามนิ้ว
    floatEl = li.cloneNode(true);
    floatEl.classList.add("floating");
    floatEl.style.width = rect.width + "px";
    floatEl.style.top = rect.top + "px";
    document.body.appendChild(floatEl);

    // แถวต้นฉบับกลายเป็น placeholder (คงความสูง อยู่ใน flow) — แถวอื่นไม่ไหลขึ้น
    li.classList.add("ghost-src");

    try { e.target.setPointerCapture(e.pointerId); } catch (ignore) {}
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  }

  function positionFloat() {
    if (!floatEl) return;
    var top = lastClientY - grabDY;
    var maxTop = window.innerHeight - floatEl.offsetHeight - 2;
    if (top < 2) top = 2;
    if (top > maxTop) top = maxTop;
    floatEl.style.top = top + "px";
  }

  // ย้าย ghost placeholder ไปยังตำแหน่งที่นิ้วชี้ (insertBefore) — CSS transition ทำให้แถวอื่นเลื่อนนุ่มเอง
  function updateGhostPos() {
    if (!srcEl) return;
    var rows = Array.prototype.slice.call(list.querySelectorAll("li"))
                    .filter(function (r) { return r !== srcEl && r.getAttribute("data-id"); });
    var y = lastClientY;
    var target = null;
    for (var i = 0; i < rows.length; i++) {
      var rc = rows[i].getBoundingClientRect();
      if (y < rc.top + rc.height / 2) { target = rows[i]; break; }
    }
    if (target) {
      if (srcEl.nextSibling !== target) list.insertBefore(srcEl, target);
    } else {
      if (list.lastChild !== srcEl) list.appendChild(srcEl);
    }
  }

  function autoScroll() {
    autoScrollRAF = null;
    if (dragId == null) return;
    var margin = 70, speed = 0;
    if (lastClientY < margin) speed = -Math.ceil((margin - lastClientY) / 6);
    else if (lastClientY > window.innerHeight - margin) speed = Math.ceil((lastClientY - (window.innerHeight - margin)) / 6);
    if (speed !== 0) {
      window.scrollBy(0, speed);
      positionFloat();
      updateGhostPos();
      autoScrollRAF = requestAnimationFrame(autoScroll);
    }
  }

  function onMove(e) {
    if (dragId == null) return;
    lastClientY = e.clientY;
    positionFloat();
    updateGhostPos();
    if (autoScrollRAF == null) autoScrollRAF = requestAnimationFrame(autoScroll);
  }

  function onUp(e) {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    if (dragId == null) return;
    if (autoScrollRAF != null) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }

    if (floatEl && floatEl.parentNode) floatEl.parentNode.removeChild(floatEl);
    floatEl = null;
    if (srcEl) srcEl.classList.remove("ghost-src");

    // อ่านลำดับใหม่จาก DOM (ตาม data-id ปัจจุบันในลิสต์) → เขียน order ให้กลุ่มเดียวกัน
    commitOrderFromDOM(dragId);
    srcEl = null;
    dragId = null;
  }

  // อ่านลำดับ <li> ใน DOM แล้วเขียน order กลับเข้า items (เฉพาะกลุ่ม done เดียวกับตัวที่ลาก)
  function commitOrderFromDOM(movedId) {
    var moved = items.filter(function (x) { return x.id === movedId; })[0];
    if (!moved) return;
    var domIds = Array.prototype.slice.call(list.querySelectorAll("li"))
                      .map(function (r) { return r.getAttribute("data-id"); })
                      .filter(function (id) { return !!id; });
    // ลำดับใน DOM เฉพาะ item ที่ done เท่ากับตัวที่ลาก
    var sameGroup = domIds.filter(function (id) {
      var it = items.filter(function (x) { return x.id === id; })[0];
      return it && !it.deleted && (!!it.done === !!moved.done);
    });
    var now = Date.now();
    sameGroup.forEach(function (id, i) {
      var it = items.filter(function (x) { return x.id === id; })[0];
      if (it) { it.order = i + 1; it.updatedAt = now; }
    });
    save(); render(true); scheduleSync();
  }

  function removeItem(it) {
    it.deleted = true;
    it.updatedAt = Date.now();
    save(); render(true); scheduleSync();
  }

  function add() {
    var t = inp.value.trim();
    if (!t) return;
    var now = Date.now();
    var maxOrder = items.reduce(function (m, x) { return Math.max(m, x.order == null ? 0 : x.order); }, 0);
    items.push({ id: now + "" + Math.random().toString(36).slice(2, 6), text: t, done: false, addedAt: now, doneAt: null, updatedAt: now, deleted: false, order: maxOrder + 1, store: "" });
    inp.value = "";
    save(); render(true); inp.focus(); scheduleSync();
  }

  document.getElementById("add").onclick = add;
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  document.getElementById("clearDone").onclick = function () {
    var now = Date.now();
    items.forEach(function (x) { if (x.done && !x.deleted) { x.deleted = true; x.updatedAt = now; } });
    save(); render(true); scheduleSync();
  };

  /* ---------- store (ร้านค้า) ---------- */
  function setStore(it, storeName) {
    it.store = storeName;
    it.updatedAt = Date.now();
    save();
    // อัปเดต in-place ป้ายร้านของแถวนี้ (ไม่ rebuild ลิสต์ → ไม่กระพริบ)
    var li = list.querySelector('li[data-id="' + it.id + '"]');
    if (li) {
      var meta = li.querySelector(".meta");
      if (meta) {
        var mhtml = "➕ เพิ่ม: " + fmt(it.addedAt);
        if (it.store) mhtml += "  <span class='store-tag'>🏪 " + it.store + "</span>";
        if (it.done && it.doneAt) mhtml += "<br><span class='buy'>✓ ซื้อ: " + fmt(it.doneAt) + "</span>";
        meta.innerHTML = mhtml;
      }
    }
    renderFilter();  // อัปเดต chip (จำนวน/chip ไม่ระบุร้าน) โดยไม่แตะลิสต์
    lastSig = sigOf();  // sync signature กัน render ซ้ำซ้อนตอน push กลับมา
    // ถ้ากำลัง filter ร้านอยู่ และแถวนี้หลุดเงื่อนไข filter แล้ว → ต้อง rebuild เพื่อซ่อน
    if (activeStore && (activeStore === "__none__" ? !!it.store : (it.store || "") !== activeStore)) {
      render(true);
    }
    scheduleSync();
  }

  // แถบ filter ร้าน (หน้าลิสต์) — ปุ่ม "ทั้งหมด" + ปุ่มรายร้าน
  function renderFilter() {
    var bar = document.getElementById("storefilter");
    if (!bar) return;
    if (!allStores().length) { bar.style.display = "none"; return; }
    bar.style.display = "flex";
    bar.innerHTML = "";
    var all = document.createElement("button");
    all.className = "chip" + (activeStore === "" ? " active" : "");
    all.textContent = "ทั้งหมด";
    all.onclick = function () { activeStore = ""; render(); };
    bar.appendChild(all);
    // chip: เฉพาะรายการที่ยังไม่ระบุร้าน
    var noneCount = items.filter(function (x) { return !x.deleted && !x.store; }).length;
    if (noneCount > 0) {
      var none = document.createElement("button");
      none.className = "chip" + (activeStore === "__none__" ? " active" : "");
      none.textContent = "📭 ไม่ระบุร้าน";
      none.onclick = function () { activeStore = (activeStore === "__none__" ? "" : "__none__"); render(); };
      bar.appendChild(none);
    }
    allStores().forEach(function (s) {
      var c = document.createElement("button");
      c.className = "chip" + (activeStore === s ? " active" : "");
      c.textContent = "🏪 " + s;
      c.onclick = function () { activeStore = (activeStore === s ? "" : s); render(); };
      bar.appendChild(c);
    });
  }

  // หน้าจัดการร้าน
  function renderStores() {
    var box = document.getElementById("storeList");
    var hint = document.getElementById("storeHint");
    // ดูดร้านที่ item ใช้จริงแต่ยังไม่มีใน stores เข้ามา (เช่น Watsons ที่ map ไว้ก่อนมีระบบ stores) + sync
    var merged = allStores();
    if (merged.length !== stores.length) { stores = merged; saveStores(); scheduleSync(); }
    box.innerHTML = "";
    hint.style.display = stores.length ? "none" : "block";
    allStores().forEach(function (s, idx) {
      var row = document.createElement("div");
      row.className = "store-li";
      var ic = document.createElement("div");
      ic.className = "store-ic"; ic.textContent = "🏪";
      var name = document.createElement("div");
      name.className = "name"; name.textContent = s;
      var cnt = document.createElement("span");
      cnt.className = "cnt";
      var n = items.filter(function (x) { return !x.deleted && x.store === s; }).length;
      cnt.textContent = n + " รายการ";
      var del = document.createElement("button");
      del.className = "del"; del.textContent = "✕";
      del.onclick = function () { removeStore(s); };
      row.appendChild(ic); row.appendChild(name); row.appendChild(cnt); row.appendChild(del);
      box.appendChild(row);
    });
  }

  function addStore() {
    var inp2 = document.getElementById("storeInp");
    var name = inp2.value.trim();
    if (!name) return;
    if (stores.indexOf(name) === -1) { stores.push(name); saveStores(); }
    inp2.value = "";
    renderStores(); renderFilter(); inp2.focus();
  }

  function removeStore(s) {
    stores = stores.filter(function (x) { return x !== s; });
    saveStores();
    // ปลด map ของที่ชี้ร้านนี้ออก (set store="" + updatedAt) ให้ sync ด้วย
    var now = Date.now();
    items.forEach(function (x) { if (x.store === s) { x.store = ""; x.updatedAt = now; } });
    if (activeStore === s) activeStore = "";
    save(); renderStores(); render(true); scheduleSync();
  }

  document.getElementById("storeAdd").onclick = addStore;
  document.getElementById("storeInp").addEventListener("keydown", function (e) { if (e.key === "Enter") addStore(); });

  /* ---------- tab switch ---------- */
  function switchPage(pg) {
    document.getElementById("tabList").classList.toggle("active", pg === "list");
    document.getElementById("tabStore").classList.toggle("active", pg === "store");
    document.getElementById("page-list").classList.toggle("active", pg === "list");
    document.getElementById("page-store").classList.toggle("active", pg === "store");
    if (pg === "store") renderStores();
    else render(true);
  }
  document.getElementById("tabList").onclick = function () { switchPage("list"); };
  document.getElementById("tabStore").onclick = function () { switchPage("store"); };

  /* ---------- settings ---------- */
  var overlay = document.getElementById("overlay");
  document.getElementById("gear").onclick = function () {
    document.getElementById("urlInput").value = cfg.url || "";
    document.getElementById("pauseChk").checked = !!cfg.pause;
    overlay.classList.add("open");
  };
  document.getElementById("cfgCancel").onclick = function () { overlay.classList.remove("open"); };
  overlay.onclick = function (e) { if (e.target === overlay) overlay.classList.remove("open"); };
  document.getElementById("cfgSave").onclick = function () {
    var wasPaused = cfg.pause;
    cfg.url = document.getElementById("urlInput").value.trim();
    cfg.pause = document.getElementById("pauseChk").checked;
    saveCfg();
    overlay.classList.remove("open");
    // เปิด sync ใหม่ (หรือเพิ่ง set url) → ดึงล่าสุดแล้วดันของเราขึ้นไป merge
    if (canSync()) { scheduleSync(); }
    else setSync(cfg.pause ? "⏸ หยุด sync ชั่วคราว" : "");
  };

  // ของเดิมที่ยังไม่มี field order → เซ็ตให้ตามลำดับปัจจุบัน (ครั้งเดียว)
  function normalizeOrder() {
    var need = items.some(function (x) { return !x.deleted && x.order == null; });
    if (!need) return;
    var i = 1;
    items.filter(function (x) { return !x.deleted; })
         .sort(function (a, b) { return (a.done - b.done) || (a.addedAt - b.addedAt); })
         .forEach(function (x) { if (x.order == null) x.order = i; i++; });
    save();
  }

  // ลบ tombstone (deleted) ที่เก่ากว่า 30 วัน กันสะสมไม่รู้จบ (ลบไปนานแล้ว ทุกเครื่องรับรู้แล้ว)
  function pruneTombstones() {
    var cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    var before = items.length;
    items = items.filter(function (x) { return !(x.deleted && (x.updatedAt || 0) < cutoff); });
    if (items.length !== before) save();
  }

  /* ---------- boot ---------- */
  pruneTombstones();
  normalizeOrder();
  render();
  if (canSync()) pull();
  else if (cfg.pause) setSync("⏸ หยุด sync ชั่วคราว");
})();
</script>
</body>
</html>
